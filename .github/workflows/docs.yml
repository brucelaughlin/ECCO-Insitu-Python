# Builds the documentation (docs/sphinx) and publishes it to GitHub Pages when the main branch
# changes. One-time setup in the GitHub repository: Settings -> Pages -> Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:          # run by hand from the Actions tab; ecco-insitu publish-reports starts it
                              # (on main) after pushing the gh-pages branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[diagnostics,docs]"
      - name: "Build (strict: warnings are errors)"
        run: python -m sphinx -b html -W --keep-going docs/sphinx docs/sphinx/_build/html
      # The profile reports live on the gh-pages branch (ecco-insitu publish-reports), not on main:
      # copy them into the site so a docs build keeps them and a report publish keeps the docs.
      - name: Add the published profile reports (gh-pages branch)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages
            mkdir -p /tmp/reports && git --work-tree=/tmp/reports checkout origin/gh-pages -- .
            rm -f /tmp/reports/README.md
            cp -r /tmp/reports/. docs/sphinx/_build/html/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/sphinx/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
