# =====================================================================================
# NCEI chain settings: defaults.
#
# Do NOT edit this file for a particular machine or run. Instead:
#   - config/local.yaml      this machine's data locations (not committed; copy
#                            config/local.example.yaml to start)
#   - --config my_run.yaml   settings for one run (any subset of the keys below)
# Settings are merged in this order: defaults.yaml, local.yaml, $ECCO_INSITU_CONFIG,
# each --config file, then command-line flags. Later ones win.
# An unknown key or a value of the wrong type is an error, so typos are caught.
#
# Paths: absolute, or relative to data_root. "~" and ${ENV_VARS} are expanded.
# Every run writes the merged settings it used to <run>/documentation/run_config.yaml.
# =====================================================================================

# Folder that relative paths below are taken from. Usually set in config/local.yaml.
data_root: null

# -------------------------------------------------------------------------------------
# Input data the chain needs (set in config/local.yaml; see local.example.yaml)
# -------------------------------------------------------------------------------------
paths:
  # LLC90 model grid: XC/YC/hFacC/... .data/.meta files (steps 01, 04, 10, 13)
  grid_dir: null
  # geodesic bin files llc090_sphere_point_n_*_ids.bin (step 02)
  sphere_bin_dir: null
  # ---------------------------------------------------------------------------------
  # CLIMATOLOGY (step 03). You do NOT need to have one already:
  #   * Have your own?  Point climatology_file at it. Any NetCDF with potential_T_monthly
  #     and S_monthly on (month=12, depth, lat, lon), regular lon/lat, potential T in deg C,
  #     works (full rules: docs/input_contract.md, section 2).
  #   * Don't have one?  Set climatology_file to where it should go (the file need not
  #     exist), then run:   ecco-insitu climatology --build
  #     That downloads WOA23 (~1.4 GB) and builds the standard climatology this project
  #     uses: monthly fields to 1500 m stitched onto seasonal fields to 5500 m, in-situ T
  #     converted to potential T with the chain's own routine.
  #   * Optional, faster:  ecco-insitu climatology --prebake  (writes into prebaked_clim_dir)
  #   * Check either way:  ecco-insitu climatology
  # The chain checks the climatology before every run and stops with these instructions if
  # it is missing or unusable.
  # ---------------------------------------------------------------------------------
  # monthly potential-T / S climatology, full depth (see the box above)
  climatology_file: null
  # folder of *_prebaked.nc copies, one per input depth grid (optional, faster; made by --prebake;
  # only those made from climatology_file are used)
  prebaked_clim_dir: null
  # CTD-based T and S uncertainty (sigma) on the LLC90 grid, big-endian float32 (step 04)
  sigma_files:
    prof_T: null
    prof_S: null
  # Arctic T and S uncertainty files (EASE2 100 km), used north of high_latitude_sigma.min_lat
  high_lat_sigma_files:
    prof_T: null
    prof_S: null
  # geodesic bin centers (diagnostics/report_spatial_scaling.py)
  geodesic_bin_csv: null

# -------------------------------------------------------------------------------------
# Where a run reads and writes (run_ncei.sh and the diagnostics)
# -------------------------------------------------------------------------------------
run:
  # folder of input profile files, searched recursively for *.nc
  input_dir: null
  # each run writes to <output_base>_<YYYYMMDD_HHMMSS> (run_ncei.sh -d gives an exact folder)
  output_base: null
  # parallel worker processes; null = min(8, number of CPUs - 1)
  n_workers: null
  # which post-steps run_ncei.sh runs after steps 01-10
  spatial_scaling: true      # step 11
  scaling_plots: false       # diagnostics/report_spatial_scaling.py after step 11
  compact: false             # step 12
  pack: true                 # step 13

# -------------------------------------------------------------------------------------
# Steps 01-10 (NCEI.py)
# -------------------------------------------------------------------------------------
chain:
  # profile variables processed
  variables: [prof_T, prof_S]
  # model grid: LLC<llcN>
  llcN: 90
  # step 01: 1 = place profiles on wet grid points only, 0 = on all points
  wet_or_all: 1

  # step 04: uncertainties and weights
  # keep weights that are already zero in the input file
  respect_existing_zero_weights: false
  # lower bound on sigma per variable (deg C, psu)
  new_floor:
    prof_T: 0
    prof_S: 0.005

  # step 05: convert in-situ T to potential T.
  #   auto  = the file's metadata decides (prof_T labeled potential -> not converted,
  #           in-situ -> converted); with no label, a check against the climatology decides
  #           (loudly flagged in the log); if that is unclear too, T is converted.
  #           The check never overrides a label.
  #   true / false = force. All of Interp_Profiles is labeled potential.
  convert_insitu_T_to_potential: auto
  # fill missing S with climatology S, for the conversion only (prof_S is not changed)
  replace_missing_S_with_clim_S: true

  # step 06: climatology-cost tests
  # skip the tests poleward of dubious_clim_lat_threshold (WOA23 is unreliable there) ...
  exclude_high_latitude_profiles_from_clim_cost: true
  dubious_clim_lat_threshold: 60
  # ... except for profiles that have a high-latitude sigma (Arctic file or southern constant)
  clim_cost_qc_with_high_lat_sigma: true

  # step 08: true = trim trailing depth levels with no data in the whole file;
  # false = keep the full input depth grid (empty levels get zero weight)
  remove_extraneous_depth_levels: false

  # step 09: sub-daily profiles to once daily. Among profiles on the same day within
  # distance_tolerance (m) of each other, keep the one whose HHMMSS is closest to
  # closest_time (120000 = noon). method: 1 (the only one implemented).
  distance_tolerance: 5000.0
  closest_time: 120000
  method: 1

  # step 10: multiply weights by the LLC90 area factor gamma
  apply_gamma_factor: true

# -------------------------------------------------------------------------------------
# High-latitude uncertainties (step 04), used instead of the CTD sigma poleward of min_lat
# -------------------------------------------------------------------------------------
high_latitude_sigma:
  # false = CTD sigma everywhere (and no step 06 tests poleward of the threshold)
  enabled: true
  min_lat: 60
  # north: nearest Arctic-file cell with a value within this distance (km)
  max_dist_km: 300
  # variable names inside paths.high_lat_sigma_files
  north_file_vars:
    prof_T: Theta_rmse_se
    prof_S: S_rmse_se
  # south: no file yet; a constant sigma at all depths (deg C, psu). null = CTD sigma.
  south_constant:
    prof_T: 10.0
    prof_S: 5.0

# -------------------------------------------------------------------------------------
# Step 11: spatial scaling
# -------------------------------------------------------------------------------------
spatial_scaling:
  # profile-density windows: monthly or 10day
  window: monthly

# -------------------------------------------------------------------------------------
# Step 13: packing into ECCO-ready files (see optimize_profile_files.py)
# -------------------------------------------------------------------------------------
pack:
  llc: 90
  # per-rank tile size (v4r6 SIZE.h sNx = sNy = 30)
  tile: 30
  # files labeled in whole years; a too-dense year is split into parts
  year_rule: whole_years
  # auto, or an integer
  nobsglob: auto
  # auto: fewest files within this fraction of the smallest NFILESPROFMAX x NOBSGLOB
  tolerance: 0.05
  # auto: optional cap on the number of files (null = none)
  max_files: null
  # these sources are split by sub-folder (ITP_L2 / ITP_L3); the rest, one provenance per source
  split_by_subdir: [ITP]

# -------------------------------------------------------------------------------------
# Diagnostics and climatology tools: where reports and built files go
# -------------------------------------------------------------------------------------
diagnostics:
  # report_profile_counts.py output parent folder
  report_dir: null
  # report_costs.py output parent folder
  cost_report_dir: null
