<script>

    const raw = cols(await gz(`${refBase()}/${src}/${S.ref === 'clim' ? '' : S.ref + '/'}${V}_${String(k).padStart(2, '0')}.bin`), [['ix', Uint32Array, 4, true], ['v', Uint16Array, 2]]);

// Besides single levels, the ranges of the cost map explorer: the standard bands of the report's maps
// (0-50, 50-100, 100-250, 250-500, 500-1000, 1000-2000, 2000-4000 m, deeper), 100 m bands, and the 97 levels in
// 15 or 30 consecutive groups. In a range each profile counts once, with the mean of its values at the
// range's levels (the levels it has); so counts, cells and dots stay "profiles", as in the original app.

    for (let i = 0; i + 1 < edges.length; i++) {
      const lv = d.map((z, k) => [z, k]).filter(([z]) => z >= edges[i] && z < edges[i + 1]).map(([, k]) => k);
      if (lv.length) out.push({label: edges[i + 1] === Infinity ? `below ${edges[i]} m` : `${edges[i]}–${edges[i + 1]} m`, levels: lv});

  const vstep = d => { const vs = INDEX.vars.filter(V => REF().levels[V].length); S.V = vs[(vs.indexOf(S.V) + d + vs.length) % vs.length]; fixDepth(); fillDepth(); recompute(); };
  document.getElementById('vprev').onclick = () => vstep(-1); document.getElementById('vnext').onclick = () => vstep(1);
  const dstep = d => {
    if (S.dmode === 'level') { const lv = REF().levels[S.V], i = lv.indexOf(S.k); S.k = lv[(i + d + lv.length) % lv.length]; }
    else { const gs = groupsWithData(), i = gs.findIndex(g => g.i === S.g); S.g = gs[(i + d + gs.length) % gs.length].i; }
    fillDepth(); recompute(); };
  document.getElementById('dmode').onchange = e => { S.dmode = e.target.value;
    if (S.dmode !== 'level') { const gs = groupsWithData(); S.g = (gs.find(g => g.levels.includes(S.k)) || gs[0]).i; }
    fillDepth(); recompute(); };
  document.getElementById('dprev').onclick = () => dstep(-1); document.getElementById('dnext').onclick = () => dstep(1);
  document.getElementById('dsel').onchange = e => { if (S.dmode === 'level') S.k = +e.target.value; else S.g = +e.target.value; recompute(); };
  document.getElementById('bathy').onclick = e => { SHOW_BATHY = !SHOW_BATHY; e.target.classList.toggle('on', SHOW_BATHY); draw(); };
  // reference: climatology or model (if the data folder has model values)
  const refs = INDEX.refs || {clim: 'climatology'};
  if (Object.keys(refs).length > 1) {
    document.getElementById('refgrp').style.display = '';
    const box = document.getElementById('refs');
    box.innerHTML = Object.entries(refs).map(([r, t]) => `<button class="btn${r === S.ref ? ' on' : ''}" data-ref="${r}" title="${t}">${r === 'clim' ? 'climatology' : 'model'}</button>`).join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => {
      if (!INDEX.classes[S.src].refs?.[b.dataset.ref] && b.dataset.ref !== 'clim') return;
      S.ref = b.dataset.ref; box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      fixVar(); fillDepth(); recompute(); });
  }
  document.getElementById('cap').onchange = e => { S.cap = +e.target.value; draw(); };
  document.getElementById('reset').onclick = () => resetZoom();
  document.getElementById('resetall').onclick = () => { S.dmode = 'level'; document.getElementById('dmode').value = 'level';
    S.k = REF().levels[S.V][0]; fillDepth(); resetZoom(); recompute(); };
  const lo = document.getElementById('tlo'), hi = document.getElementById('thi'); let timer = null;
  const later = () => { syncTime(); clearTimeout(timer); timer = setTimeout(recompute, 350); };
  lo.oninput = () => { S.all = false; S.t0 = +lo.value; if (S.t0 > S.t1) S.t1 = S.t0; later(); };
  hi.oninput = () => { S.all = false; S.t1 = +hi.value; if (S.t1 < S.t0) S.t0 = S.t1; later(); };
  const N = () => INDEX.years1 - INDEX.years0, cl = (v) => Math.max(0, Math.min(N(), v));
  const fromAll = () => { if (S.all) { S.all = false; S.t0 = 0; S.t1 = N(); } };
  document.getElementById('tall').onclick = () => { S.all = true; syncTime(); recompute(); };
  [['tl0', 0, -1], ['tr0', 0, 1], ['tl1', 1, -1], ['tr1', 1, 1]].forEach(([id, end, d]) => document.getElementById(id).onclick = () => {
    fromAll(); if (end === 0) { S.t0 = cl(S.t0 + d); if (S.t0 > S.t1) S.t1 = S.t0; } else { S.t1 = cl(S.t1 + d); if (S.t1 < S.t0) S.t0 = S.t1; } later(); });
  const shift = d => { if (S.all) return; if (S.t0 + d < 0 || S.t1 + d > N()) return; S.t0 += d; S.t1 += d; later(); };
  document.getElementById('shl').onclick = () => shift(-1); document.getElementById('shr').onclick = () => shift(1);
}
function fixVar() { const lv = REF().levels; if (!lv[S.V].length) S.V = INDEX.vars.find(V => lv[V].length); fixDepth(); }
function fixDepth() { const lv = REF().levels[S.V]; if (!lv.includes(S.k)) S.k = lv.reduce((a, b) => Math.abs(b - S.k) < Math.abs(a - S.k) ? b : a, lv[0]); }
function fillDepth() {
  document.getElementById('vlab').textContent = S.V;
  const d = document.getElementById('dsel');
  if (S.dmode === 'level') {
    const lv = REF().levels[S.V];
    d.innerHTML = lv.map(k => `<option value="${k}">${k + 1}: ${INDEX.depth[k]} m</option>`).join(''); d.value = S.k;
  } else {
    const gs = groupsWithData(); if (!gs.some(g => g.i === S.g)) S.g = gs[0].i;
    d.innerHTML = gs.map(g => `<option value="${g.i}">${g.label} (${g.levels.length} levels)</option>`).join(''); d.value = S.g;
  }
}
function fillTime() {
  const ci = INDEX.classes[S.src], N = INDEX.years1 - INDEX.years0, lo = document.getElementById('tlo'), hi = document.getElementById('thi');
  lo.max = hi.max = N; if (S.all) { S.t0 = ci.years[0] - INDEX.years0; S.t1 = ci.years[1] - INDEX.years0; } syncTime();
}
function syncTime() {
  const N = INDEX.years1 - INDEX.years0, lo = document.getElementById('tlo'), hi = document.getElementById('thi'), f = document.getElementById('tfill');
  lo.value = S.t0; hi.value = S.t1; document.getElementById('tall').classList.toggle('on', S.all);
  f.style.left = (S.all ? 0 : 100 * S.t0 / N) + '%'; f.style.width = (S.all ? 100 : 100 * (S.t1 - S.t0) / N) + '%';
  document.getElementById('tlab').textContent = S.all ? 'all years' : S.t0 === S.t1 ? `${INDEX.years0 + S.t0}` : `${INDEX.years0 + S.t0}–${INDEX.years0 + S.t1}`;
}
// Each page map owns its view (deck.gl's viewState prop): every change goes through setView, which keeps the map
// on screen (no panning past the map's edges, no zooming out past its whole view). Home = every whole view.
function clampView(M, v) {
  const zoom = Math.max(M.home.zoom, Math.min(M.home.zoom + 9, v.zoom)), d = 1 / Math.pow(2, zoom);
  const hw = M.el.clientWidth / 2 * d, hh = M.el.clientHeight / 2 * d, [ex0, ey0, ex1, ey1] = M.extent;
  const cx = 2 * hw >= ex1 - ex0 ? (ex0 + ex1) / 2 : Math.max(ex0 + hw, Math.min(ex1 - hw, v.target[0]));
  const cy = 2 * hh >= ey1 - ey0 ? (ey0 + ey1) / 2 : Math.max(ey0 + hh, Math.min(ey1 - hh, v.target[1]));
  return {...M.home, target: [cx, cy, 0], zoom};
}
function setView(M, v, now) {
  M.view = clampView(M, v); M.deck.setProps({viewState: M.view});
  clearTimeout(M.t);
  const go = () => { if (!STATS) return; drawMap(M); if (M.id === 'll') titles(); };
  if (now) go(); else M.t = setTimeout(go, 60);
}
function resetZoom() { for (const M of MAPS) setView(M, M.home, true); if (STATS) titles(); }

// ---------- start ----------
function homeZoom(M) {                  // the zoom at which the map's whole view fills its box
  const [ex0, ey0, ex1, ey1] = M.extent;
  return Math.log2(Math.min(M.el.clientWidth / (ex1 - ex0), M.el.clientHeight / (ey1 - ey0)));
}
function sizeBoxes() {
  const main = document.getElementById('mapbox'), w = main.clientWidth;
  main.style.height = Math.round(w / 2) + 'px';
  const side = Math.max(320, Math.min(w, window.innerHeight - 70));
  for (const h of ['N', 'S']) { const b = document.getElementById('box-' + h); b.style.width = side + 'px'; b.style.height = side + 'px'; }
}
function addMap(id, elId, legendId, bins, land, extent, proj, latOf, bathy) {
  const M = {id, el: document.getElementById(elId), legend: document.getElementById(legendId), bins, land,
    coast: land.flat(), extent, proj, latOf, bathy};
  const z = homeZoom(M);
  M.home = {target: [(extent[0] + extent[2]) / 2, (extent[1] + extent[3]) / 2, 0], zoom: z, minZoom: z, maxZoom: z + 9};
  M.view = {...M.home};
  M.deck = new deck.DeckGL({container: M.el, views: new deck.OrthographicView({id: 'o-' + id, flipY: false}),
    viewState: M.home, controller: {doubleClickZoom: false, scrollZoom: {smooth: false}}, getCursor: () => 'crosshair',
    onViewStateChange: ({viewState}) => setView(M, viewState)});
  MAPS.push(M);
  for (const b of bins.keys()) ANY_BIN.add(b);
  return M;
}
async function init() {
  busy('Loading…');
  INDEX = await (await fetch(DATA_URL + '/index.json')).json();
  INDEX.n_bins_grid = (await (await fetch(DATA_URL + '/bins.json')).json()).n_bins_grid;
  const yrs = Object.values(INDEX.classes).map(c => c.years); INDEX.years0 = Math.min(...yrs.map(y => y[0])); INDEX.years1 = Math.max(...yrs.map(y => y[1]));
  const [bins, land, binsN, binsS, landN, landS] = await Promise.all([loadBins('/bins.bin'), unzip(DATA_URL + '/land.json'),
    loadBins('/bins_N.bin'), loadBins('/bins_S.bin'), unzip(DATA_URL + '/land_N.json'), unzip(DATA_URL + '/land_S.json'), loadBathy()]);
  // ?src=<class> opens on that class; the "← report" button goes to the report that opened the viewer (?back=),
  // else to the run's report (index.json report_url)
  const q = new URLSearchParams(location.search), want = q.get('src'), back = q.get('back') || INDEX.report_url;
  S.src = want && INDEX.classes[want] ? want : INDEX.classes.CTD_WOD ? 'CTD_WOD' : Object.keys(INDEX.classes)[0]; fixVar();
  if (back && /^https?:\/\//.test(back)) {
    const a = document.getElementById('back'); a.href = back; a.style.display = '';
    // came from the report in this tab: go back to it (the report keeps its place); otherwise open it
    a.onclick = e => { if (document.referrer && document.referrer.split('?')[0] === back.split('?')[0] && history.length > 1) { e.preventDefault(); history.back(); } };
  }
  sizeBoxes();
  const r40 = Math.hypot(...polarXY(0, POLAR_EDGE_LAT, 'N'));
  addMap('ll', 'map', 'legend', bins, land, [-180, -90, 180, 90], (lon, lat) => [lon, lat], (x, y) => y, BATHY);
  MAIN_Z0 = MAPS[0].home.zoom;
  addMap('N', 'map-N', 'legend-N', binsN, landN, [-r40, -r40, r40, r40], (lon, lat) => polarXY(lon, lat, 'N'), (x, y) => polarLat(x, y, 'N'), polarBathy('N'));
  addMap('S', 'map-S', 'legend-S', binsS, landS, [-r40, -r40, r40, r40], (lon, lat) => polarXY(lon, lat, 'S'), (x, y) => polarLat(x, y, 'S'), polarBathy('S'));
  window.addEventListener('resize', () => { sizeBoxes(); for (const M of MAPS) { const z = homeZoom(M);
    M.home = {...M.home, zoom: z, minZoom: z, maxZoom: z + 9}; if (M.id === 'll') MAIN_Z0 = z; setView(M, M.view, true); } if (STATS) { titles(); colorbars(); } });
  setupControls(); fillDepth(); fillTime();
  await recompute();
}
init().catch(e => { busy(null); document.getElementById('titlebox').textContent = 'error: ' + e.message; console.error(e); });
</script>
