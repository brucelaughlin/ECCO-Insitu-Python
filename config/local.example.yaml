# Copy to config/local.yaml (not committed) and edit for this machine.
# Relative paths are taken from data_root. See ecco_insitu/defaults.yaml for what each file is.

data_root: /path/to/your/data

paths:
  grid_dir: sample_data/ecco-insitu/sweet_gdrive/grid_llc90
  sphere_bin_dir: sample_data/ecco-insitu/sweet_gdrive/grid_llc90/sphere_point_distribution
  # ---------------------------------------------------------------------------------
  # CLIMATOLOGY (step 03). You do NOT need to have one already:
  #   * Have your own?  Point climatology_file at it. Any NetCDF with potential_T_monthly
  #     and S_monthly on (month=12, depth, lat, lon), regular lon/lat, potential T in deg C,
  #     works (full rules: docs/input_contract.md, section 2).
  #   * Don't have one?  Set climatology_file to where it should go (the file need not
  #     exist), then run:   ecco-insitu climatology --build
  #     That downloads WOA23 (~1.4 GB) and builds the standard climatology this project
  #     uses: monthly fields to 1500 m stitched onto seasonal fields to 5500 m, in-situ T
  #     converted to potential T with the chain's own routine.
  #   * Optional, faster:  ecco-insitu climatology --prebake  (writes into prebaked_clim_dir)
  #   * Check either way:  ecco-insitu climatology
  # The chain checks the climatology before every run and stops with these instructions if
  # it is missing or unusable.
  # ---------------------------------------------------------------------------------
  climatology_file: woa23_climatology/woa23_decav91C0_TS_clim_potential_T_1deg_fulldepth.nc
  prebaked_clim_dir: woa23_climatology
  sigma_files:
    prof_T: sample_data/ecco-insitu/sweet_gdrive/CTD_sigma_TS/Theta_sigma_smoothed_method_02_masked_merged_capped_extrapolated.bin
    prof_S: sample_data/ecco-insitu/sweet_gdrive/CTD_sigma_TS/Salt_sigma_smoothed_method_02_masked_merged_capped_extrapolated.bin
  high_lat_sigma_files:
    prof_T: profile_data/high_latitude_uncertanties/expected_rmse_from_woa23_and_aotd_potential_temperature_ease2_100km.nc
    prof_S: profile_data/high_latitude_uncertanties/expected_rmse_from_woa23_and_aotd_salinity_ease2_100km.nc
  geodesic_bin_csv: sample_data/ecco-insitu/sweet_gdrive/geodesic/10242_bin_locations.csv

run:
  input_dir: profile_data/Interp_Profiles
  output_base: processed_by_NCEI_profile_data/profile_files_NCEI_processed

diagnostics:
  report_dir: insitu_reports
  cost_report_dir: cost_reports
